name: QAIRU notify

on:
  schedule:
    # UTC (Астана = UTC+5). Каждые 5 минут со сдвигом на :02 — GitHub часто пропускает запуски,
    # а notify.py догоняет всё, что не ушло, поэтому больше попыток = надёжнее.
    - cron: "2-59/5 1-12 * * *"    # 06:02–17:57 — напоминания о парах
    - cron: "2-59/5 17-18 * * *"   # 22:02–23:57 — вечерняя сводка
  workflow_dispatch:
    inputs:
      mode:
        description: "auto — как по расписанию, summary — сводка сейчас, test — тестовое сообщение"
        type: choice
        options: [test, summary, auto]
        default: test

permissions:
  contents: write   # чтобы сохранить sent.json (что уже отправлено)

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send messages
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: python notify.py
      - name: Save sent.json
        run: |
          [ -f sent.json ] || exit 0
          git config user.name "qairu-bot"
          git config user.email "qairu-bot@users.noreply.github.com"
          git add sent.json
          git diff --cached --quiet && exit 0
          git commit -m "Update sent.json"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
