name: QAIRU notify

on:
  schedule:
    # UTC (Астана = UTC+5). Не ровно в :00/:30 — в это время GitHub чаще пропускает запуски.
    - cron: "7,37 1-12 * * *"    # 06:07–17:37 — напоминания о парах
    - cron: "7,27,47 17 * * *"   # 22:07, 22:27, 22:47 — вечерняя сводка (с запасом)
    - cron: "7 18 * * *"         # 23:07 — последний шанс для сводки
  workflow_dispatch:
    inputs:
      mode:
        description: "auto — как по расписанию, summary — сводка сейчас, test — тестовое сообщение"
        type: choice
        options: [test, summary, auto]
        default: test

permissions:
  contents: write   # чтобы сохранить sent.json (что уже отправлено)

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send messages
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: python notify.py
      - name: Save sent.json
        run: |
          [ -f sent.json ] || exit 0
          git config user.name "qairu-bot"
          git config user.email "qairu-bot@users.noreply.github.com"
          git add sent.json
          git diff --cached --quiet && exit 0
          git commit -m "Update sent.json"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
