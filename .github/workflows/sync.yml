name: QAIRU sync

on:
  schedule:
    # Время в UTC. Казахстан = UTC+5 → запуски в 06:00 и 14:00 по Астане
    - cron: "0 1 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # чтобы сохранить data.json в репозиторий

concurrency:
  group: qairu-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scrape campus.qairu
        env:
          QAIRU_LOGIN: ${{ secrets.QAIRU_LOGIN }}
          QAIRU_PASSWORD: ${{ secrets.QAIRU_PASSWORD }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python scraper.py
      - name: Save data.json
        run: |
          git config user.name "qairu-bot"
          git config user.email "qairu-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update data.json"
          git push
